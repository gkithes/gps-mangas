<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GPS Μάγκας">
  <title>GPS Μάγκας</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="map"></div>

  <!-- πάνω: αναζήτηση -->
  <div id="top">
    <form id="search" class="card">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="dest" type="search" placeholder="Πού πάμε, ρε;" data-i18n-ph="search.ph" autocomplete="off" enterkeyhint="search">
      <button type="submit" class="search-go" data-i18n="search.go">Πάμε</button>
      <button type="button" id="open-settings" class="icon-btn" aria-label="Ρυθμίσεις" data-i18n-aria="aria.settings">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </form>
    <div id="install-tip" class="card install-tip" hidden>
      <div><b data-i18n="install.title">Για πλήρη οθόνη</b><p data-i18n="install.steps"></p></div>
      <button id="install-close" class="icon-btn" aria-label="Κλείσιμο" data-i18n-aria="aria.close">✕</button>
    </div>
    <button id="locate" class="locate" hidden data-i18n="locate.btn">📍 Δεν ξέρω πού είσαι — πάτα για τοποθεσία</button>
    <ul id="results" class="card list"></ul>
  </div>

  <!-- πλοήγηση: κάρτα οδηγίας -->
  <div id="banner" class="card" hidden>
    <div class="maneuver"><svg id="arrow" viewBox="0 0 48 48"></svg></div>
    <div>
      <div id="dist"></div>
      <div id="instr"></div>
    </div>
    <div id="then" hidden>
      <span class="then-label" data-i18n="then">Μετά</span>
      <svg id="then-arrow" viewBox="0 0 48 48"></svg>
      <span id="then-instr"></span>
      <span id="then-dist"></span>
    </div>
    <div id="quip"></div>
    <div id="status" hidden></div>
    <button id="steps-toggle" class="steps-toggle"><span data-i18n="steps.all">☰ Όλες οι στροφές</span> <span class="chev">▾</span></button>
  </div>

  <!-- πλοήγηση: όλες οι επόμενες στροφές -->
  <div id="steps" class="card" hidden>
    <ul id="steps-list" class="list"></ul>
  </div>

  <div id="bottom">
    <div class="fabs">
      <button id="map-style" class="fab" aria-label="Δορυφόρος">🛰</button>
      <button id="recenter" class="fab" aria-label="Κέντρο" data-i18n-aria="aria.recenter" hidden>
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>

    <!-- αρχική: κοντινά + πρόσφατα/αγαπημένα -->
    <div id="home-panel">
      <div id="ribbon"></div>
      <div id="drawer" class="card">
        <button id="drawer-toggle">
          <span data-i18n="drawer.title">Πρόσφατα &amp; Αγαπημένα</span>
          <svg class="ico chev" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
        </button>
        <div id="drawer-body" hidden>
          <div class="tabs">
            <button data-tab="history" data-i18n="tab.history">Πρόσφατα</button>
            <button data-tab="favorites" data-i18n="tab.favorites">★ Αγαπημένα</button>
          </div>
          <ul id="saved-list" class="list"></ul>
        </div>
      </div>
    </div>

    <!-- κοντινά μέρη -->
    <div id="places-panel" class="card panel" hidden>
      <header>
        <h3 id="places-title"></h3>
        <button id="places-close" class="icon-btn" aria-label="Κλείσιμο" data-i18n-aria="aria.close">✕</button>
      </header>
      <ul id="places-list" class="list"></ul>
    </div>

    <!-- επιλογή διαδρομής -->
    <div id="preview-panel" class="card panel" hidden>
      <header>
        <div class="titles">
          <h3 id="preview-title"></h3>
          <small id="preview-sub"></small>
        </div>
        <button id="preview-fav" class="icon-btn" aria-label="Αγαπημένο" data-i18n-aria="aria.fav">☆</button>
        <button id="preview-close" class="icon-btn" aria-label="Κλείσιμο" data-i18n-aria="aria.close">✕</button>
      </header>
      <div class="travel">
        <button data-travel="drive">🚗 <span data-i18n="travel.drive">Αυτοκίνητο</span></button>
        <button data-travel="walk">🚶 <span data-i18n="travel.walk">Με τα πόδια</span></button>
      </div>
      <ul id="route-list" class="list"></ul>
      <button id="go" class="pill primary wide" data-i18n="go">Ξεκίνα</button>
    </div>

    <!-- πλοήγηση: κάτω μπάρα -->
    <div id="navbar" class="card" hidden>
      <div class="trip">
        <div><b id="eta-min">–</b><span data-i18n="trip.min">λεπτά</span></div>
        <div><b id="eta-km">–</b><span data-i18n="trip.dist">απόσταση</span></div>
        <div><b id="eta-clock">–</b><span data-i18n="trip.arrive">άφιξη</span></div>
      </div>
      <div class="nav-actions">
        <button id="mute" class="icon-btn" aria-label="Σίγαση" data-i18n-aria="aria.mute"></button>
        <button id="sim" class="pill" data-i18n="sim">Προσομοίωση</button>
        <button id="stop" class="pill danger" data-i18n="stop">Τέλος</button>
      </div>
    </div>
  </div>

  <!-- φύλλο επιλογών (⋯, οδηγίες τοποθεσίας) -->
  <div id="actions" class="sheet-wrap" hidden>
    <div class="sheet small">
      <h3 id="actions-title"></h3>
      <div id="actions-buttons"></div>
      <button id="actions-cancel" class="pill wide" data-i18n="cancel">Άκυρο</button>
    </div>
  </div>

  <!-- ρυθμίσεις -->
  <div id="settings" class="sheet-wrap" hidden>
    <div class="sheet">
      <header>
        <h2 data-i18n="set.title">Ρυθμίσεις</h2>
        <button id="close-settings" class="pill" data-i18n="close">Κλείσιμο</button>
      </header>

      <section>
        <h3 data-i18n="set.general">Γενικά</h3>
        <label><span data-i18n="set.style">Στυλ</span>
          <select id="s-style">
            <option value="magkas" data-i18n="style.magkas">😎 Μάγκας (με ατάκες)</option>
            <option value="normal" data-i18n="style.normal">🧭 Κανονικό GPS (χωρίς ατάκες)</option>
          </select>
        </label>
        <label><span data-i18n="set.uiLang">Γλώσσα εφαρμογής</span> 🌐
          <select id="s-uilang"></select>
        </label>
        <label><span data-i18n="set.units">Μονάδες απόστασης</span>
          <select id="s-units">
            <option value="auto" data-i18n="units.auto">Αυτόματα (από τη γλώσσα του κινητού)</option>
            <option value="km" data-i18n="units.km">Χιλιόμετρα</option>
            <option value="mi" data-i18n="units.mi">Μίλια</option>
          </select>
        </label>
        <label><span data-i18n="set.mapStyle">Εμφάνιση χάρτη</span>
          <select id="s-mapstyle">
            <option value="map" data-i18n="map.mapLong">Χάρτης (δρόμοι)</option>
            <option value="satellite" data-i18n="map.sat">Δορυφόρος</option>
          </select>
        </label>
        <button id="clear-poi" class="pill wide" data-i18n="set.clearPoi">🧹 Καθάρισμα αποθηκευμένων κοντινών μερών</button>
      </section>

      <section>
        <h3 data-i18n="set.voice">Φωνή</h3>
        <label><span data-i18n="set.voicePick">Φωνή ανάγνωσης</span>
          <select id="s-voice"><option value="" data-i18n="voice.auto">Αυτόματα</option></select>
        </label>
        <p class="hint" id="voice-hint" data-i18n="voice.hint"></p>
        <label><span data-i18n="set.rate">Ταχύτητα</span> <output id="o-rate"></output>
          <input id="s-rate" type="range" min="0.6" max="1.6" step="0.1">
        </label>
        <label><span data-i18n="set.pitch">Τόνος</span> <output id="o-pitch"></output>
          <input id="s-pitch" type="range" min="0.5" max="1.8" step="0.1">
        </label>
        <label><span data-i18n="set.volume">Ένταση</span> <output id="o-volume"></output>
          <input id="s-volume" type="range" min="0" max="1" step="0.1">
        </label>
        <button id="test-voice" class="pill wide" data-i18n="voice.test">▶ Δοκιμή φωνής</button>
      </section>

      <section>
        <h3 data-i18n="set.sound">Ήχος</h3>
        <label><span data-i18n="set.mode">Τι ακούγεται</span>
          <select id="s-mode">
            <option value="both" data-i18n="mode.both">Οδηγίες + ατάκες</option>
            <option value="quips" data-i18n="mode.quips">Μόνο ατάκες</option>
            <option value="plain" data-i18n="mode.plain">Μόνο οδηγίες (σοβαρό)</option>
            <option value="mute" data-i18n="mode.mute">Σίγαση</option>
          </select>
        </label>
        <label><span data-i18n="set.quipLang">Γλώσσα ατάκων</span>
          <select id="s-lang"></select>
        </label>
        <label class="row"><span data-i18n="set.chime">Ήχος «ντινγκ» πριν από κάθε οδηγία</span>
          <input id="s-chime" type="checkbox">
        </label>
        <label><span data-i18n="set.speed">Προειδοποίηση ταχύτητας πάνω από</span> <output id="o-speed"></output>
          <input id="s-speed" type="range" min="50" max="160" step="10">
        </label>
        <p class="hint" data-i18n="sound.hint"></p>
      </section>

      <section>
        <h3 data-i18n="set.rec">Οι δικές μου ηχογραφήσεις</h3>
        <p class="hint" data-i18n="rec.hint"></p>
        <label><span data-i18n="rec.cat">Περίπτωση</span>
          <select id="rec-cat"></select>
        </label>
        <div class="rec-buttons">
          <button id="rec-btn" class="pill rec" data-i18n="rec.record">● Ηχογράφηση</button>
          <label class="pill file"><span data-i18n="rec.upload">Ανέβασμα αρχείου</span>
            <input id="rec-file" type="file" accept="audio/*" hidden>
          </label>
        </div>
        <ul id="rec-list"></ul>
        <label><span data-i18n="rec.how">Πώς παίζονται</span>
          <select id="s-myaudio">
            <option value="mix" data-i18n="my.mix">Ανάμικτα με τις γραπτές ατάκες</option>
            <option value="only" data-i18n="my.only">Μόνο οι δικές μου (όπου υπάρχουν)</option>
            <option value="off" data-i18n="my.off">Ποτέ</option>
          </select>
        </label>
      </section>
      <p id="app-version" class="hint version"></p>
    </div>
  </div>

  <div id="toast" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/NoSleep.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
